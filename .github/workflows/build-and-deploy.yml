name: Build and Deploy to Azure

on:
  push:
    branches:
      - main

env:
  ACR_NAME: mariajose
  ACR_LOGIN_SERVER: mariajose.azurecr.io
  CONTAINER_NAME: mar-ia-jose

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate version tag
        id: version
        run: echo "tag=$(date +'%Y%m%d%H%M')" >> "$GITHUB_OUTPUT"

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build and push Docker image
        run: |
          IMAGE="${{ env.ACR_LOGIN_SERVER }}/${{ env.CONTAINER_NAME }}"
          VERSION="${{ steps.version.outputs.tag }}"

          docker build -t "$IMAGE:$VERSION" .
          docker tag "$IMAGE:$VERSION" "$IMAGE:latest"
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"

      - name: Update Web App container image
        run: |
          IMAGE="${{ env.ACR_LOGIN_SERVER }}/${{ env.CONTAINER_NAME }}"
          VERSION="${{ steps.version.outputs.tag }}"
          ACR_PASSWORD=$(az acr credential show --name ${{ env.ACR_NAME }} --query "passwords[0].value" -o tsv)
          echo "::add-mask::$ACR_PASSWORD"

          az webapp config container set \
            --name ${{ secrets.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --docker-custom-image-name "$IMAGE:$VERSION" \
            --docker-registry-server-url "https://${{ env.ACR_LOGIN_SERVER }}" \
            --docker-registry-server-user ${{ env.ACR_NAME }} \
            --docker-registry-server-password "$ACR_PASSWORD"

      - name: Restart Azure Web App
        run: |
          az webapp restart \
            --name ${{ secrets.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }}
